name: build
on:
  push:
    branches: [main, dev]
    tags: ['v*']
  pull_request:
permissions:
  contents: write   # create the GitHub Release on v* tags
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: CLI dependency matches the branch
        run: |
          spec=$(node -p "require('./package.json').devDependencies['advanced-preset']")
          if [ "$GITHUB_REF" != refs/heads/dev ] && [ "$GITHUB_EVENT_NAME" != pull_request ] && [ "$spec" = dev ]; then
            echo "::error::advanced-preset is \"dev\" — pin a released range (e.g. ^1.7.0) before merging into main"; exit 1
          fi
      - run: npm install
      - run: npx ap --version
      - run: npx ap check --strict
      - run: npx ap build
      - run: git diff --exit-code dist || (echo "dist/ is stale — run npm run build and commit" && exit 1)
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with: { files: dist/*.apreset.json }
