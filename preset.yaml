# Petals Preset (花瓣预设) v7 — Freesia & Petals collaborative writing for Advanced Preset.
formatVersion: 1
id: petals
name: Petals Preset
version: 7.8.1
author: mirrorange
description: Write stories with Freesia! Freesia writes, Petals gives suggestions — a dual-character driven workflow.
minAdvancedPreset: 1.7.0
# Other manifest keys live in manifest/*.yaml; `ap build` merges them into this file.

actors:
  narrator: { name: Freesia, prefix: "{{ap::name::narrator}}: ", color: primary }
  editor: { name: Petals, prefix: "{{ap::name::editor}}: ", color: accent }
  user: { name: "{{user}}", prefix: "{{ap::name::user}}: " }
narrator: narrator
user: user

styles:
  prefill: dialogue
  plaintext: dialogue
  structured: imperative
  tool-single: imperative
  tool-multi: imperative
plaintextFormat: prefix
contentMarker: <START_OF_CONTENT>
prefillGuide: <START_OF_STORY>
historyItemTemplate: "{{prefix}}{{content}}"
stageHeading: "### Step {{n}} · {{label}} ({{actor}}){{optional}} → `{{target}}`"

regions:
  - { id: top, role: system, merge: join }
  - { id: role, role: system }
  - { id: mode, role: system }
  - { id: guidelines, role: system, merge: { wrap: guidelines } }
  - { id: writing_style, role: system, merge: { wrap: writing_style } }
  - { id: settings, native: true }
  - { id: history, role: system, anchor: historyStart }
  - { id: memory, role: system, merge: join, anchor: historyEnd }
  - { id: questions, role: system, merge: join }
  - { id: task, role: system }
  - { id: bottom, role: system, anchor: tail }
workflowRegion: task

theme:
  light: { primary: "#c026d3", accent: "#9333ea" }
  dark: { primary: "#e879f9", accent: "#c084fc" }

carrier:
  label: 🌸 Petals
  order:
    - top
    - role
    - mode
    - guidelines
    - writing_style
    - main: false
    - worldInfoBefore
    - personaDescription
    - charDescription
    - charPersonality
    - scenario
    - enhanceDefinitions: false
    - nsfw: false
    - worldInfoAfter
    - dialogueExamples
    - history
    - chatHistory
    - jailbreak: false
    - memory
    - questions
    - task
    - bottom

migrations:
  - from: "<7.0.0"
    rename:
      modules: {}
      params: {}
